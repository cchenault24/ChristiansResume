version: 1
backend:
  phases:
    build:
      commands:
        - "# Execute Amplify CLI with the helper script"
        - amplifyPush --simple
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - yarn install --immutable
        - 'echo "GraphQL Endpoint is $VITE_AWS_APPSYNC_GRAPHQL_ENDPOINT"'
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
