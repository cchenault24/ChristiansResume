version: 1
backend:
  phases:
    build:
      commands:
        - "# Execute Amplify CLI with the helper script"
        - amplifyPush --simple
        - "# Verify config files were generated"
        - ls -la src/aws-exports.js || echo "aws-exports.js not found"
        - cat src/aws-exports.js || echo "Cannot read aws-exports.js"
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - yarn install --immutable
        - "# Verify config files exist"
        - ls -la src/aws-exports.js src/amplifyconfiguration.json || echo "Config files missing"
        - cat src/aws-exports.js
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
