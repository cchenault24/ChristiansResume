version: 1
backend:
  phases:
    build:
      commands:
        - '# Execute Amplify CLI with the helper script'
        - amplifyPush --simple
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - yarn install --immutable
    build:
      commands:
        - yarn build
  artifacts:
    baseDirectory: dist # Change to 'build' if using React
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
